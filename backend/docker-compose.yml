services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: 'my_shop'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes' # Для разработки оставим без пароля
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: