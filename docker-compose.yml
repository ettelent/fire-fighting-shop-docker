services:
  # Твоя база данных (то, что было в бекенде, теперь тут)
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: 'my_shop'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  # Твой бэкенд
  backend:
    build: ./backend
    ports:
      - '3000:3000'
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./fronted:/fronted
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_NAME=my_shop

volumes:
  db_data: